services:
  - type: web
    name: priya-hardware
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: priya-hardware-data
      mountPath: /var/data
      sizeGB: 1
